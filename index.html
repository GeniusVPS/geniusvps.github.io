        let selectedIds = new Set();
        const MAX_SELECTION = 6;

        function renderNews() {
            const list = document.getElementById('news-list');
            list.innerHTML = '';
            newsData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'news-card';
                card.innerHTML = `
                    <input type="checkbox" id="news-${item.id}" value="${item.id}" onchange="toggleSelection('${item.id}', this)">
                    <div class="news-content">
                        <div class="news-headline">
                            <span class="news-id">#${item.id}</span> ${item.headline}
                        </div>
                        <div class="news-meta">${item.date} | ${item.source}</div>
                        <div class="news-summary">${item.summary}</div>
                    </div>
                `;
                list.appendChild(card);
            });
        }

        function toggleSelection(id, checkbox) {
            if (checkbox.checked) {
                if (selectedIds.size >= MAX_SELECTION) {
                    alert('最多只能選擇 ' + MAX_SELECTION + ' 則新聞！');
                    checkbox.checked = false;
                    return;
                }
                selectedIds.add(id);
            } else {
                selectedIds.delete(id);
            }
            updateUI();
        }

        function updateUI() {
            const countEl = document.getElementById('count');
            const btn = document.getElementById('copy-btn');
            countEl.textContent = selectedIds.size;
            btn.disabled = selectedIds.size === 0;
            
            if (selectedIds.size === MAX_SELECTION) {
                countEl.style.color = '#27ae60';
            } else {
                countEl.style.color = '#e74c3c';
            }
        }

        document.getElementById('copy-btn').addEventListener('click', () => {
            const ids = Array.from(selectedIds).sort().join(', ');
            navigator.clipboard.writeText(ids).then(() => {
                const toast = document.getElementById('toast');
                toast.className = 'toast show';
                setTimeout(() => { toast.className = 'toast'; }, 3000);
            });
        });

        renderNews();
    </script>
