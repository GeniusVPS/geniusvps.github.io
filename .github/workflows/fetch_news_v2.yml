name: Fetch News v2

on:
  schedule:
    # 每 3 小時執行一次 (UTC)
    - cron: "0 */3 * * *"
  workflow_dispatch:
    # 支援手動觸發

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install opencc

      - name: Create pool-v2 directory
        run: |
          mkdir -p pool-v2

      - name: Run Fetch Script v2
        env:
          LONGCAT_API_KEY: ${{ secrets.LONGCAT_API_KEY }}
          LONGCAT_API_URL: https://api.longcat.chat/openai/v1/chat/completions
          LONGCAT_MODEL: LongCat-2.0-Preview
        run: |
          python3 scripts-v2/fetch_news_v2.py

      - name: Verify JSON output
        run: |
          # 檢查今日 JSON 檔案是否存在
          TODAY=$(date -u -d '+8 hours' '+%Y-%m-%d')
          if [ -f "pool-v2/${TODAY}.json" ]; then
            echo "✅ JSON 檔案已生成: pool-v2/${TODAY}.json"
            # 顯示新聞數量
            python3 -c "
import json
with open('pool-v2/${TODAY}.json', 'r') as f:
    news = json.load(f)
    print(f'📰 今日新聞數: {len(news)} 條')
"
          else
            echo "⚠️  今日無新新聞，JSON 檔案未更新"
          fi

      - name: Commit & Push Changes
        run: |
          git config user.name "TechCanto Bot"
          git config user.email "bot@techcanto.github.io"
          git add -A
          CHANGES=$(git status --porcelain)
          if [ -n "$CHANGES" ]; then
            git commit -m "📰 更新新聞池 v2 - $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M HKT')"
            git push
            echo "✅ 有更新，已 push"
          else
            echo "📭 無新新聞，skip commit"
          fi
